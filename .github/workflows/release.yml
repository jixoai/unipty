name: Release

# Task 7.4 release gate: package publication requires at least one native
# passing tuple for EVERY official route, proven by uploaded conformance
# artifacts from the same tested commit; the aggregated catalog attaches to
# the same tagged release. Site deployment stays independently retryable
# (deploy-www.yml) and never blocks publication.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  verify-route-coverage:
    name: Verify route coverage and aggregate the release catalog
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Collect evidence records for the tested commit
        run: node packages/conformance/scripts/collect-release-evidence.mjs "${GITHUB_SHA}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - id: identity
        run: echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Aggregate the deterministic release catalog (validates schema, identity, tuple, uniqueness, route coverage)
        run: |
          set -euo pipefail
          evidence_args=""
          for file in /tmp/release-evidence/*.json; do
            evidence_args="$evidence_args --evidence $file"
          done
          metadata_args=""
          for file in /tmp/release-metadata/*.json; do
            metadata_args="$metadata_args --metadata $file"
          done
          # shellcheck disable=SC2086
          node packages/conformance/runners/aggregate.ts \
            $evidence_args $metadata_args \
            --commit "${GITHUB_SHA}" --release-tag "${GITHUB_REF_NAME}" \
            --out dist-release/catalog.json
      - name: Upload the catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-catalog-${{ github.ref_name }}
          path: dist-release/catalog.json

  publish:
    name: Publish packages from the tested commit
    needs: verify-route-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-route-coverage.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Retrieve the aggregated catalog from the verification job
        uses: actions/download-artifact@v4
        with:
          name: release-catalog-${{ github.ref_name }}
          path: dist-release
      - name: Pack the publishable set
        run: >-
          corepack pnpm --filter unipty --filter @unipty/backend --filter @unipty/helper-backend
          --filter @unipty/backend-node-pty --filter @unipty/backend-bun
          --filter @unipty/backend-deno-sigma__pty-ffi pack
      - name: Attach the catalog to the tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/catalog.json
      # npm publication itself is Owner-gated (task 9.3): the workflow is
      # wired but remains a manual decision until the Owner accepts the
      # release artifact. Uncomment after acceptance.
      # - run: corepack pnpm -r --filter './packages/*' --filter '!@unipty/conformance' --filter '!@unipty/www' publish --access public --no-git-checks
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
