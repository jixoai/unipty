name: Release

# Task 7.4 release gate: package publication requires at least one native
# passing tuple for EVERY official route, proven by uploaded conformance
# artifacts from the same tested commit; the aggregated catalog attaches to
# the same tagged release. Publication uses npm Trusted Publishing (the
# packages' trusted publishers are bound to release.yml + the npm-publish
# environment; no registry token is stored in the repository). Site
# deployment stays independently retryable (deploy-www.yml) and never blocks
# publication.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  verify-route-coverage:
    name: Verify route coverage and aggregate the release catalog
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Collect evidence records for the tested commit
        run: node packages/conformance/scripts/collect-release-evidence.mjs "${GITHUB_SHA}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - id: identity
        run: echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Aggregate the deterministic release catalog (validates schema, identity, tuple, uniqueness, route coverage)
        run: |
          set -euo pipefail
          evidence_args=""
          for file in /tmp/release-evidence/*.json; do
            evidence_args="$evidence_args --evidence $file"
          done
          metadata_args=""
          for file in /tmp/release-metadata/*.json; do
            metadata_args="$metadata_args --metadata $file"
          done
          # shellcheck disable=SC2086
          node packages/conformance/runners/aggregate.ts \
            $evidence_args $metadata_args \
            --commit "${GITHUB_SHA}" --release-tag "${GITHUB_REF_NAME}" \
            --out dist-release/catalog.json
      - name: Upload the catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-catalog-${{ github.ref_name }}
          path: dist-release/catalog.json

  publish:
    name: Publish packages from the tested commit
    needs: verify-route-coverage
    runs-on: ubuntu-latest
    # npm Trusted Publishing: each package's npm-side trusted publisher is
    # bound to this repository + this workflow file (release.yml) + this
    # environment. npm >= 11.5 exchanges the job's OIDC token for a
    # short-lived registry credential — no NODE_AUTH_TOKEN involved.
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-route-coverage.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - name: Ensure an npm CLI with Trusted Publishing support (>= 11.5)
        run: npm install -g npm@11
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Retrieve the aggregated catalog from the verification job
        uses: actions/download-artifact@v4
        with:
          name: release-catalog-${{ github.ref_name }}
          path: dist-release
      - name: Pack the publishable set
        run: >-
          corepack pnpm --filter unipty --filter @unipty/backend --filter @unipty/helper-backend
          --filter @unipty/backend-node-pty --filter @unipty/backend-bun
          --filter @unipty/backend-deno-sigma__pty-ffi pack
          --pack-destination dist-release/packs
      - name: Publish via npm Trusted Publishing (dependency order)
        run: |
          set -euo pipefail
          packs="dist-release/packs"
          # npm pack names a tarball "<name-without-scope>-<version>.tgz";
          # resolve each package's exact version from its manifest so the
          # filename is unambiguous (a plain "unipty-backend-*" glob would
          # also match the longer route tarballs).
          publish() {
            name="$1"
            dir="$2"
            version="$(node -p "require('./${dir}/package.json').version")"
            tarball="${packs}/${name##*/}-${version}.tgz"
            echo "publishing ${tarball}"
            npm publish "${tarball}" --access public --provenance
          }
          publish unipty packages/unipty
          publish @unipty/backend packages/backend
          publish @unipty/backend-node-pty packages/backend-node-pty
          publish @unipty/backend-bun packages/backend-bun
          publish @unipty/backend-deno-sigma__pty-ffi packages/backend-deno-sigma__pty-ffi
          publish @unipty/helper-backend packages/helper-backend
      - name: Attach the catalog to the tagged release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/catalog.json
