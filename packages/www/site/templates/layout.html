<link rel="stylesheet" href="/assets/styles.css">
<script>
(function () {
  var dark = true;
  try {
    var stored = localStorage.getItem("unipty-theme");
    dark = stored
      ? stored === "dark"
      : window.matchMedia("(prefers-color-scheme: light)").matches === false;
  } catch (e) {
    /* keep dark */
  }
  if (dark) document.documentElement.classList.add("dark");
})();
</script>
</head>

      <a href="/docs.html"{{NAV_DOCS}}>Docs</a>
      <a href="/compatibility.html"{{NAV_COMPAT}}>Compatibility</a>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle theme"><span aria-hidden="true">◐</span></button>
  </div>
</header>
